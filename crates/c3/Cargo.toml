[package]
name = "c3"
description = "C3 runtime library: engines, panel, router, index, pack, telemetry, and the providers/preflight logic."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
c3-core.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
chrono.workspace = true
clap.workspace = true
sha2.workspace = true
uuid.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
ureq.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
ignore = { workspace = true }
globset = { workspace = true }
url = { workspace = true }
unicode-normalization = { workspace = true }
surrealdb = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
# OPT-IN (flipped 2026-10-14): the default build is the light bundle - no surrealdb/tokio, and
# every ContextIndex call is `Index: none`. `--features index-surreal` builds the embedded
# index (DESIGN §7). `c3-cli` re-exposes the same feature and forwards it, and depends on c3
# with `default-features = false`.
default = []
index-surreal = ["dep:surrealdb", "dep:tokio"]

# The embedded index lock (`<collab>/.c3/index.lock`) uses the same exclusive share-mode
# open as c3-core's TaskLock on Windows; Unix has no share mode, so it takes an advisory
# flock through std's `File::try_lock` (the same mechanism c3-core uses) - no extra crate.
