[package]
name = "c3"
description = "C3 runtime library: engines, panel, router, index, pack, telemetry, and the providers/preflight logic."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
c3-core.workspace = true
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
chrono.workspace = true
clap.workspace = true
sha2.workspace = true
uuid.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
ureq.workspace = true
ignore = { workspace = true }
globset = { workspace = true }
surrealdb = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[features]
# ON by default so the release library carries the index; a `--no-default-features` build
# drops surrealdb/tokio entirely and every ContextIndex call becomes `Index: none`. This is
# the documented fast development loop (DESIGN §7). `c3-cli` re-exposes the same feature and
# forwards it, and turns it off by depending on c3 with `default-features = false`.
default = ["index-surreal"]
index-surreal = ["dep:surrealdb", "dep:tokio"]

# The embedded index lock (`<collab>/.c3/index.lock`) uses the same exclusive share-mode
# open as c3-core's TaskLock on Windows; Unix has no share mode, so it takes an advisory
# flock via fs4 (the same crate c3-core uses), target-scoped so Windows pulls nothing extra.
[target.'cfg(unix)'.dependencies]
fs4 = { version = "1", default-features = false, features = ["sync"] }
