[package]
name = "c3-core"
description = "C3 contracts and formats: roster, purpose, effort vocabularies, lineage, preflight verdict, config walk, path normalisation. Dependency-light."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
regex.workspace = true
fancy-regex = "0.14"
chrono.workspace = true
url.workspace = true

# Unix advisory file locks for the write-lock/ownership-lock guards (store.rs, health.rs). On
# Windows the store uses the exact FileShare semantics the plugin passes to
# `[IO.File]::Open` (via std's `OpenOptionsExt::share_mode`); on Unix there is no
# share-mode, so a real `flock` advisory lock is taken through std's `File::try_lock`
# (stable since Rust 1.89: fail-fast, on a plain `&File`, no guard type, released with the
# handle). The earlier `fs4` dependency was never compiled on Unix and its 1.x API had moved;
# std covers the need without a crate.

[dev-dependencies]
# chrono-tz: the reset-time unit tests read Berlin's daylight-saving rules by the zone's IANA id
# (`Europe/Berlin`), as the plugin's harness reads `W. Europe Standard Time` / `Europe/Berlin` -
# a test-only zone database; production reads the machine's own zone through `chrono::Local`.
chrono-tz = "0.10"
