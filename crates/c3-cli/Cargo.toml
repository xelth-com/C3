[package]
name = "c3-cli"
description = "The c3 binary: CLI commands and (later) the stdio MCP server."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[[bin]]
name = "c3"
path = "src/main.rs"

[dependencies]
# default-features = false so `--no-default-features` on the binary turns the index off;
# the `index-surreal` feature below forwards to c3 and is on by default.
c3 = { workspace = true, default-features = false }
c3-core.workspace = true
clap.workspace = true

[features]
default = ["index-surreal"]
index-surreal = ["c3/index-surreal"]

[dev-dependencies]
# The moved mcp_integration test drives the JSON-RPC session with serde_json.
serde_json.workspace = true
