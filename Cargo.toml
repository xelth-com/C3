[workspace]
resolver = "2"
members = ["crates/c3-core", "crates/c3", "crates/c3-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["xelth-com"]
license = "MIT"
repository = "https://github.com/xelth-com/C3"
homepage = "https://xelth.com/C3/"

[workspace.dependencies]
c3-core = { path = "crates/c3-core" }
c3 = { path = "crates/c3" }
serde = { version = "1", features = ["derive"] }
# preserve_order: `serde_json::Value` keeps object keys in parse/insertion order, so the
# polymorphic ledger fields (reviewer.provider_config, panel.limits, ...) round-trip in the
# exact on-disk order the PowerShell bridge wrote them. Required by `ps_json`.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }

# The port adds a dependency only when a ported piece needs it. surrealdb and tokio
# are deliberately absent until milestone 8 (index) and the http engine (milestone 7).

[profile.release]
strip = true
lto = true
codegen-units = 1
