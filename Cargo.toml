[workspace]
resolver = "2"
members = ["crates/c3-core", "crates/c3", "crates/c3-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["xelth-com"]
license = "MIT"
repository = "https://github.com/xelth-com/C3"
homepage = "https://xelth.com/C3/"

[workspace.dependencies]
c3-core = { path = "crates/c3-core" }
# default-features = false here so that c3-cli alone decides whether the `index-surreal`
# feature is on (its own default) — otherwise cargo ignores the crate's `default-features`.
c3 = { path = "crates/c3", default-features = false }
serde = { version = "1", features = ["derive"] }
# preserve_order: `serde_json::Value` keeps object keys in parse/insertion order, so the
# polymorphic ledger fields (reviewer.provider_config, panel.limits, ...) round-trip in the
# exact on-disk order the PowerShell bridge wrote them. Required by `ps_json`.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
regex = "1"
# url: strict parsing of an http reviewer's base URL (M7b-b security S2) — scheme/host/no
# userinfo/no query/no fragment; already in the lock file via ureq.
url = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
# base64: the panel member spec travels as base64 of compact UTF-8 JSON on the child's command
# line (the port's own JSON wire format, m4-spec open question 3), like the plugin's -PanelSpec.
base64 = "0.22"
# ed25519-dalek: verify the detached signature on the maintainer's priors.json (M9 §3).
# default-features off — the core VerifyingKey/Signature/verify (and from_bytes signing used
# only by the tests) are always compiled, so no rng/std/zeroize/serde extras are pulled in.
ed25519-dalek = { version = "2", default-features = false }
# ureq: a small blocking HTTP client (rustls, bundled roots) for the T-hub telemetry POSTs
# and DELETE. Blocking on purpose — the send runs in a detached thread with a 3 s timeout,
# so C3 pulls in no async runtime for one background call per consultation.
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
# ignore + globset: the pack pipeline's file discovery (milestone 7). `ignore` gives the same
# .gitignore-aware repository walk eckSnapshot relies on (respecting nested .gitignore,
# .git/info/exclude and the global excludes) with directory pruning; `globset` compiles C3's
# hard-ignore list (`.env*`, key/cert files, index dirs, logs) that must apply regardless of
# .gitignore. Blocking, no async runtime.
ignore = "0.4"
globset = "0.4"
# surrealdb + tokio: the derived context index (milestone 8), behind the `index-surreal`
# feature and off in a `--no-default-features` build. `kv-surrealkv` is the embedded
# single-writer store (per-project `.c3/index/`); `protocol-ws` compiles the `ws://`
# per-user-server client (connection-string parsing only, not tested live here). The
# dependency adds ~26 min to a cold release build (RC1), hence the feature gate. tokio is
# a current-thread runtime the otherwise-sync index code blocks on for the async surreal API.
surrealdb = { version = "3", default-features = false, features = ["kv-surrealkv", "protocol-ws"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
