# C3 continuous integration: format, lint and test on Linux and Windows.
#
# - fmt, clippy and `cargo test` of the default (light) build run on both runners; one extra
#   job builds and tests `--features index-surreal` (SurrealDB) on ubuntu only, where the cold
#   build is affordable.
# - No secrets: nothing here needs a key, and the live `http` runs are never part of CI.
# - The cargo registry and the target directory are cached per lock file and feature set.
name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check:
    name: ${{ matrix.os }} / default features
    runs-on: ${{ matrix.os }}
    # A hung test must not hold a runner for hours: the Windows job takes about 17 minutes.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          # rust-toolchain.toml pins the version and its components; this installs it
          rustup show active-toolchain || rustup toolchain install
          rustc --version && cargo --version
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      # The Windows job is not steady: two hangs without a log and, on 2026-11-24, a fake
      # launcher's `--version` that "did not finish within 15 s". The c3-cli tests start hundreds
      # of freshly written scripts and binaries; a real-time scan of each is the first suspect
      # (on the development machine the scanner even quarantined a test file). An experiment, not
      # a proven cure: keep the scanner off the build and the scratch directories.
      - name: Keep the virus scanner off the build and scratch directories (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE", "$env:RUNNER_TEMP", "$env:TEMP", "$env:USERPROFILE\.cargo", "$env:USERPROFILE\.rustup"
          Add-MpPreference -ExclusionProcess "cargo.exe", "rustc.exe", "c3.exe", "git.exe", "powershell.exe", "pwsh.exe"
          (Get-MpPreference).ExclusionPath
      - name: Cache target (default features)
        uses: actions/cache@v4
        with:
          path: target
          key: target-default-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: target-default-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy (default features)
        run: cargo clippy -p c3 -p c3-core -p c3-cli --all-targets -- -D warnings
      # Windows: one test thread - the fake codex/claude launchers each start Windows PowerShell 5.1,
      # and a parallel cold start on the runner outlasts the bridge's 15 s `--version` probe.
      # --no-fail-fast: one failed test binary must not hide the binaries after it.
      # One step per crate (the same tests as `--workspace`): a hung or cancelled run names the
      # crate it was in, and `success() || failure()` runs every step after a failed one.
      - name: Test c3-core (default features)
        if: success() || failure()
        # (F38-1) a hung step is stopped as FAILED with its log kept, and the next steps still run;
        # the job-level limit alone cancels the job and leaves no log of the step that hung
        timeout-minutes: 15
        run: cargo test -p c3-core --no-fail-fast ${{ runner.os == 'Windows' && '-- --test-threads=1' || '' }}
      - name: Test c3 (default features)
        if: success() || failure()
        # (F38-1) a hung step is stopped as FAILED with its log kept, and the next steps still run;
        # the job-level limit alone cancels the job and leaves no log of the step that hung
        timeout-minutes: 15
        run: cargo test -p c3 --no-fail-fast ${{ runner.os == 'Windows' && '-- --test-threads=1' || '' }}
      # The Windows flake - a fake launcher's `claude --version` "did not finish within 15 s", twice
      # in the first test of `claude_engine` - never showed in 66 runs of a hand-started loop whose
      # test binaries were ALREADY built (workflow `flake-probe`), and 2 times in about 20 runs of
      # this job, where the test step compiled and linked twenty-five test binaries and ran them at
      # once. An experiment, not a proven cure: build them in a step of their own. (Since 0.2.6 a
      # probe that hits its limit also says which processes were still running.)
      - name: Build the c3-cli tests (default features)
        if: success() || failure()
        timeout-minutes: 25
        run: cargo test -p c3-cli --no-run
      - name: Test c3-cli (default features)
        if: success() || failure()
        # (F38-1) a hung step is stopped as FAILED with its log kept, and the next steps still run;
        # the job-level limit alone cancels the job and leaves no log of the step that hung
        timeout-minutes: 25
        run: cargo test -p c3-cli --no-fail-fast ${{ runner.os == 'Windows' && '-- --test-threads=1' || '' }}

  index-surreal:
    name: ubuntu-latest / index-surreal
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          # rust-toolchain.toml pins the version and its components; this installs it
          rustup show active-toolchain || rustup toolchain install
          rustc --version && cargo --version
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-registry-${{ runner.os }}-
      - name: Cache target (index-surreal)
        uses: actions/cache@v4
        with:
          path: target
          key: target-index-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: target-index-${{ runner.os }}-
      - name: Clippy (index-surreal)
        run: cargo clippy -p c3 -p c3-core -p c3-cli --all-targets --features c3-cli/index-surreal -- -D warnings
      # One step per crate, as in the check job; the feature reaches c3 through c3-cli, so the c3
      # step names c3's own feature (c3-core has none).
      - name: Test c3-core (index-surreal)
        if: success() || failure()
        # (F38-1) a hung step is stopped as FAILED with its log kept, and the next steps still run;
        # the job-level limit alone cancels the job and leaves no log of the step that hung
        timeout-minutes: 15
        run: cargo test -p c3-core --no-fail-fast
      - name: Test c3 (index-surreal)
        if: success() || failure()
        # (F38-1) a hung step is stopped as FAILED with its log kept, and the next steps still run;
        # the job-level limit alone cancels the job and leaves no log of the step that hung
        timeout-minutes: 15
        run: cargo test -p c3 --no-fail-fast --features c3/index-surreal
      - name: Test c3-cli (index-surreal)
        if: success() || failure()
        # (F38-1) a hung step is stopped as FAILED with its log kept, and the next steps still run;
        # the job-level limit alone cancels the job and leaves no log of the step that hung
        timeout-minutes: 15
        run: cargo test -p c3-cli --no-fail-fast --features c3-cli/index-surreal
